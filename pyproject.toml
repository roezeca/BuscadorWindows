[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "buscador-windows"
version = "0.2.2"
description = "Buscador de archivos y contenido con coincidencias aproximadas y un índice local."
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials==6.8.3",
  "rapidfuzz>=3.10,<4",
  "pypdf>=6.0,<7",
  "Pillow>=11,<13",
  "defusedxml>=0.7.1,<1",
  "pypdfium2>=4.30,<6",
  "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
buscador-windows = "buscador.app:main"

[tool.setuptools.packages.find]
include = ["buscador*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
